<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌼 Mi Ofrenda Interactiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌼 Mi Ofrenda Interactiva 🌼</h1>
            <p>💛 Un recuerdo que vive eternamente en el corazón 💛</p>
        </header>

        <div class="ofrenda">
            <div class="marco">
                <img id="imagenOfrenda" src="Foto1.jpg" alt="Fotografía">
            </div>
            <div id="puntos" class="indicadores"></div>
            <div class="vela vela1"></div>
            <div class="vela vela2"></div>
            <button id="anterior" class="flecha" aria-label="Foto anterior">&#10094;</button>
            <button id="siguiente" class="flecha" aria-label="Foto siguiente">&#10095;</button>
        </div>

        <div id="descripcion" class="descripcion">
            Un recuerdo que vive eternamente en el corazón
        </div>

        <div class="controles">
            <button id="btnMusica" class="btn-musica">
                <span id="iconoMusica">🔇</span>
                <span id="textoMusica">Reproducir música</span>
            </button>
        </div>

        <audio id="musica" loop>
            <source src="musica-ofrenda.mp3" type="audio/mpeg">
        
    </div>

    <script src="app.js"></script>
</body>
</html>
